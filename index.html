<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY TWIN - Your Digital Self</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#07070d;
    color:white;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#673ab7;
    border-radius:50%;
    filter:blur(150px);
    opacity:.25;
    top:-150px;
    left:-150px;
}

body:after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#c026d3;
    border-radius:50%;
    filter:blur(150px);
    opacity:.18;
    bottom:-180px;
    right:-150px;
}

.nav{
    position:relative;
    width:90%;
    max-width:1100px;
    margin:20px auto;
    padding:12px 18px;
    border:1px solid #292936;
    border-radius:20px;
    background:#12121b;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.logoBox{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#c026d3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,#c4b5fd,#f0abfc);
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.hero{
    width:90%;
    max-width:1100px;
    margin:80px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:9px 15px;
    border-radius:30px;
    background:#18152b;
    border:1px solid #49357a;
    color:#c4b5fd;
    font-size:11px;
    letter-spacing:1px;
}

h1{
    font-size:64px;
    line-height:1;
    margin-top:25px;
}

.gradient{
    background:linear-gradient(90deg,#9fa8ff,#d8a4ff,#f0abfc);
    -webkit-background-clip:text;
    color:transparent;
}

.description{
    margin-top:25px;
    color:#9999a8;
    line-height:1.8;
    font-size:17px;
    max-width:500px;
}

.buttons{
    margin-top:30px;
    display:flex;
    gap:12px;
}

.button{
    text-decoration:none;
    color:white;
    padding:14px 22px;
    border-radius:12px;
    font-weight:bold;
    font-size:14px;
}

.primary{
    background:linear-gradient(135deg,#6366f1,#a855f7);
}

.secondary{
    border:1px solid #353541;
    background:#15151e;
}

/* TWIN CARD */

.twin{
    background:#12121b;
    border:1px solid #30303c;
    border-radius:30px;
    padding:30px;
    text-align:center;
    box-shadow:0 30px 80px #000;
}

.live{
    color:#67e8b2;
    font-size:11px;
    letter-spacing:2px;
}

.avatar{
    width:120px;
    height:120px;
    margin:25px auto 18px;
    border-radius:30px;
    background:linear-gradient(135deg,#6366f1,#c026d3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:bold;
    box-shadow:0 0 50px #633cff55;
}

.twin h2{
    font-size:24px;
}

.role{
    display:inline-block;
    margin-top:10px;
    padding:7px 14px;
    border-radius:30px;
    background:#251a3c;
    color:#c4b5fd;
    font-size:10px;
    letter-spacing:1px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:25px;
}

.stat{
    background:#191923;
    border:1px solid #292934;
    padding:15px 5px;
    border-radius:15px;
}

.stat small{
    display:block;
    color:#666675;
    font-size:9px;
    margin-bottom:7px;
}

.stat b{
    font-size:15px;
}

.features{
    width:90%;
    max-width:1100px;
    margin:100px auto;
}

.features h2{
    font-size:30px;
}

.subtitle{
    color:#777784;
    margin-top:10px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:30px;
}

.card{
    background:#111119;
    border:1px solid #292934;
    border-radius:22px;
    padding:25px;
}

.icon{
    width:45px;
    height:45px;
    border-radius:13px;
    background:#241b3d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.card h3{
    margin-top:18px;
}

.card p{
    margin-top:10px;
    color:#777784;
    line-height:1.7;
    font-size:13px;
}

footer{
    text-align:center;
    border-top:1px solid #20202a;
    padding:40px;
    color:#555562;
    font-size:12px;
}

/* MOBILE */

@media(max-width:750px){

    .hero{
        grid-template-columns:1fr;
        margin-top:60px;
        text-align:center;
    }

    h1{
        font-size:48px;
    }

    .description{
        margin-left:auto;
        margin-right:auto;
    }

    .buttons{
        justify-content:center;
        flex-wrap:wrap;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .twin{
        max-width:500px;
        margin:auto;
    }
}

</style>
</head>

<body>

<div class="nav">

    <div class="logo">
        <div class="logoBox">M</div>
        <span>MY TWIN</span>
    </div>

    <div class="profile">AS</div>

</div>


<div class="hero">

    <div>

        <div class="badge">
            ✨ YOUR PERSONAL DIGITAL WORLD
        </div>

        <h1>
            Meet Your<br>
            <span class="gradient">Digital Self.</span>
        </h1>

        <p class="description">
            Discover your interests. Understand your learning style.
            Build a digital version of yourself.
        </p>

        <div class="buttons">

            <a href="#features" class="button primary">
                Create My Twin →
            </a>

            <a href="#about" class="button secondary">
                Explore
            </a>

        </div>

    </div>

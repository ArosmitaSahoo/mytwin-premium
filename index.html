<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MY SPACE AI</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#050507;color:#fff">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[400px] bg-[#12121b] border border-white/10 rounded-[24px] p-6">
<h1 class="text-[24px] font-bold text-center">MY SPACE AI<br><span style="color:#c4a3ff">Your Twin</span></h1>
<input id="name" placeholder="Apna naam likho" value="Arosmita Sahoo" class="mt-6 w-full bg-[#1a1a24] border border-white/20 rounded-xl px-4 py-3 outline-none">
<div class="grid grid-cols-2 gap-2 mt-4">
<button onclick="go(['Technology','Creativity'])" class="bg-white text-black rounded-xl py-3 font-bold">💻 IT</button>
<button onclick="go(['Music','Art'])" class="bg-[#1a1a24] border border-white/20 rounded-xl py-3">🎨 Arts</button>
<button onclick="go(['Business'])" class="bg-[#1a1a24] border border-white/20 rounded-xl py-3">💼 Business</button>
<button onclick="go(['Cooking','Fitness'])" class="bg-[#1a1a24] border border-white/20 rounded-xl py-3">🌸 Life</button>
</div>
</div>
</div>

<div id="dash" class="hidden p-6 max-w-[1000px] mx-auto">
<h1 class="text-[28px] font-bold">Hi <span id="uName"></span>! 👋</h1>
<p class="opacity-60 text-[13px] mt-1">Your twin for <span id="ints"></span></p>
<div id="cards" class="grid grid-cols-2 gap-3 mt-6"></div>
<br><button onclick="localStorage.clear();location.reload()" class="text-[12px] bg-white/10 px-4 py-2 rounded-full">Logout</button>
</div>

<script>
function go(list){
let n=document.getElementById('name').value;
if(n.trim()==""){n="Friend"}
localStorage.setItem('myName',n);
localStorage.setItem('myVibe',list.join(','));
showDash();
}
function showDash(){
let n=localStorage.getItem('myName')||'Friend';
let v=localStorage.getItem('myVibe')||'IT';
document.getElementById('login').classList.add('hidden');
document.getElementById('dash').classList.remove('hidden');
document.getElementById('uName').innerText=n;
document.getElementById('ints').innerText=v;
let cards="";
v.split(',').forEach(t=>{
cards+=`<div class="bg-[#12121b] border border-white/10 rounded-2xl p-4"><div class="font-bold">${t}</div><div class="text-[11px] opacity-50 mt-1">For ${n.split(' ')[0]}</div></div>`;
});
document.getElementById('cards').innerHTML=cards;
}
if(localStorage.getItem('myName')){ showDash(); }
</script>
</body></html>

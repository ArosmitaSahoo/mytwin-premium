*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:#05050a;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    top:-250px;
    left:-200px;
    background:#633cff;
    filter:blur(180px);
    opacity:.18;
    border-radius:50%;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:550px;
    height:550px;
    right:-220px;
    bottom:-250px;
    background:#c026d3;
    filter:blur(180px);
    opacity:.15;
    border-radius:50%;
    pointer-events:none;
}

    align-items:center;
    justify-content:space-between;

    border:1px solid rgba(255,255,255,.12);

    border-radius:22px;
    z-index:100;

}

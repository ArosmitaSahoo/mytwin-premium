<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MY SPACE AI</title><script src="https://cdn.tailwindcss.com"></script><style>button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}</style></head>
<body style="background:#050507;color:#fff;font-family:sans-serif">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-[400px] bg-[#12121b] border border-white/10 rounded-[28px] p-6"><h1 class="text-[26px] font-black text-center">MY SPACE AI<br><span class="bg-gradient-to-r from-violet-300 to-fuchsia-300 bg-clip-text text-transparent">Your Twin</span></h1>
<input id="name" value="Arosmita Sahoo" class="mt-6 w-full bg-[#1e1e2d] border-2 border-white/20 rounded-2xl px-5 py-4 outline-none text-[16px]">
<div class="grid grid-cols-2 gap-3 mt-5">
<button id="b1" type="button" class="bg-white text-black rounded-2xl py-4 font-black">💻 IT</button>
<button id="b2" type="button" class="bg-[#1e1e2d] border border-white/20 rounded-2xl py-4 font-bold">🎨 Arts</button>
<button id="b3" type="button" class="bg-[#1e1e2d] border border-white/20 rounded-2xl py-4 font-bold">💼 Business</button>
<button id="b4" type="button" class="bg-[#1e1e2d] border border-white/20 rounded-2xl py-4 font-bold">🌸 Life</button>
</div>
<button id="enterBtn" type="button" class="w-full mt-5 bg-gradient-to-r from-indigo-600 to-fuchsia-600 rounded-2xl py-4 font-black text-[17px]">🚀 ENTER MY SPACE →</button>
<p class="text-center text-[11px] opacity-30 mt-3">Name likho → Vibe choose karo → ENTER dabao</p>
</div></div>
<div id="dash" class="hidden"><div class="p-5 max-w-[1000px] mx-auto"><div class="flex justify-between items-center"><h1 class="text-[26px] font-black">Hi <span id="uName"></span>! 👋</h1><button onclick="localStorage.clear();location.reload()" class="text-[11px] bg-white/10 px-4 py-2 rounded-full">Logout</button></div><p class="opacity-60 text-[13px] mt-1">Your twin for <span id="ints"></span></p><div id="cards" class="grid grid-cols-2 gap-3 mt-5"></div><div class="mt-8 bg-[#12121b] border border-white/10 rounded-2xl p-5"><h3 class="font-bold">📊 Progress</h3><div id="prog" class="mt-3"></div></div></div></div>
<div id="modal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50"><div class="w-full max-w-[360px] bg-[#1e1e2d] border border-white/20 rounded-[22px] p-6"><div class="flex justify-between"><h2 id="mTitle" class="font-black text-[18px]"></h2><button onclick="closeM()" class="w-8 h-8 bg-white/10 rounded-full">✕</button></div><p id="mDesc" class="opacity-60 text-[13px] mt-2"></p><div class="mt-4 space-y-2" id="mSteps"></div><button onclick="complete()" class="w-full mt-5 bg-white text-black rounded-2xl py-4 font-black">✅ Mark as Done</button></div></div>
<script>
let selected=['Technology','Creativity'];let progress=JSON.parse(localStorage.getItem('prog')||'{}');let current='';
const DB={Technology:{title:"Web Design",desc:"HTML/CSS",steps:["Watch intro","Create page","Share"]},Creativity:{title:"UI Design",desc:"Design",steps:["Figma open","Design","Prototype"]},Music:{title:"Guitar",desc:"3 chords",steps:["Learn G,C,D","Strumming","Song"]},Art:{title:"Digital Painting",desc:"Basics",steps:["Setup","Brush","Artwork"]},"Beat Making":{title:"Beat Making",desc:"First beat",steps:["BandLab","Drums","Export"]},"Music Theory":{title:"Music Theory",desc:"Rhythm",steps:["Notes","Rhythm","Melody"]},"Sketch Daily":{title:"Sketch Daily",desc:"15 min",steps:["Sketchbook","Draw","Post"]},Business:{title:"Startup 101",desc:"Idea to launch",steps:["Write idea","Validate","Pitch"]},Cooking:{title:"Recipes",desc:"5-min",steps:["Pick","Cook","Photo"]},Fitness:{title:"Fitness Plan",desc:"7-day",steps:["Warmup","Workout","Track"]}};
function selectVibe(list,btnId){selected=list;['b1','b2','b3','b4'].forEach(id=>{document.getElementById(id).className="bg-[#1e1e2d] border border-white/20 rounded-2xl py-4 font-bold";});document.getElementById(btnId).className="bg-white text-black rounded-2xl py-4 font-black border-2 border-violet-400";}
function enterSpace(){let n=document.getElementById('name').value.trim();if(n.length<2){alert('Naam likho!');return;}localStorage.setItem('n',n);localStorage.setItem('i',selected.join(','));show();}
function show(){let n=localStorage.getItem('n')||'Arosmita';let i=localStorage.getItem('i')||'Technology,Creativity';document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('uName').innerText=n.split(' ')[0];document.getElementById('ints').innerText=i;let all=[];i.split(',').forEach(k=>{let key=k.trim();if(DB[key]) all.push(key);});if(all.length==0) all=["Technology","Creativity"];let html='';all.forEach(t=>{let done=progress[t]?'✅':'👉';let col=progress[t]?'border-emerald-500/40 bg-emerald-500/10':'border-white/10 bg-[#12121b]';html+=`<div onclick="openM('${t}')" class="border ${col} rounded-2xl p-4"><div class="font-bold flex justify-between"><span>${t}</span><span>${done}</span></div><div class="text-[11px] opacity-50 mt-1">Tap to open • For ${n.split(' ')[0]}</div><div class="mt-3 h-1.5 bg-white/10 rounded-full"><div class="h-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 rounded-full" style="width:${progress[t]?'100':'25'}%"></div></div></div>`;});document.getElementById('cards').innerHTML=html;let ph='';Object.keys(progress).forEach(k=>{ph+=`<div class="flex justify-between text-[12px]"><span>${k}</span><span class="text-emerald-300">Done</span></div>`;});if(ph=="") ph='<div class="text-[12px] opacity-50">Tap a card to start!</div>';document.getElementById('prog').innerHTML=ph;}
function openM(t){current=t;let d=DB[t]||{title:t,desc:"Learn "+t,steps:["Step 1","Step 2","Step 3"]};document.getElementById('mTitle').innerText=d.title;document.getElementById('mDesc').innerText=d.desc;document.getElementById('mSteps').innerHTML=d.steps.map((s,i)=>`<div class="bg-white/10 rounded-xl px-3 py-2.5 text-[13px]">${i+1}. ${s}</div>`).join('');document.getElementById('modal').classList.remove('hidden');}
function closeM(){document.getElementById('modal').classList.add('hidden');}
function complete(){progress[current]=true;localStorage.setItem('prog',JSON.stringify(progress));closeM();show();alert('🎉 +10 XP!');}
document.getElementById('b1').addEventListener('click',()=>selectVibe(['Technology','Creativity'],'b1'));document.getElementById('b2').addEventListener('click',()=>selectVibe(['Music','Art'],'b2'));document.getElementById('b3').addEventListener('click',()=>selectVibe(['Business'],'b3'));document.getElementById('b4').addEventListener('click',()=>selectVibe(['Cooking','Fitness'],'b4'));document.getElementById('enterBtn').addEventListener('click',enterSpace);
if(localStorage.getItem('n')) show();
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MY SPACE AI</title><script src="https://cdn.tailwindcss.com"></script></head><body style="background:#050507;color:#fff;font-family:sans-serif">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-[400px] bg-[#12121b] border border-white/10 rounded-[24px] p-6"><h1 class="text-[24px] font-bold text-center">MY SPACE AI<br><span style="background:linear-gradient(90deg,#a5b4ff,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Your Twin</span></h1><input id="name" placeholder="Your Name: Arosmita Sahoo" value="Arosmita Sahoo" class="mt-6 w-full bg-[#1a1a24] border border-white/10 rounded-xl px-4 py-3 outline-none"><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="go(['Technology','Creativity'])" class="bg-white text-black rounded-xl py-3 font-bold">💻 IT</button><button onclick="go(['Music','Art'])" class="bg-[#1c1c26] border border-white/10 rounded-xl py-3">🎨 Arts</button><button onclick="go(['Business'])" class="bg-[#1c1c26] border border-white/10 rounded-xl py-3">💼 Business</button><button onclick="go(['Cooking','Fitness'])" class="bg-[#1c1c26] border border-white/10 rounded-xl py-3">🌸 Life</button></div></div></div>
<div id="dash" class="hidden"><div class="p-6 max-w-[1000px] mx-auto"><div class="flex justify-between"><h1 class="text-[32px] font-bold">Hi <span id="uName">Arosmita</span>! 👋</h1><button onclick="localStorage.clear();location.reload()" class="text-[12px] opacity-50">Logout</button></div><p class="opacity-50 mt-2">Your twin for <span id="ints"></span></p><div id="cards" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-6"></div></div></div>
<script>
const DB={Technology:["Web Design","AI Tools","Portfolio"],Music:["Guitar","Beat Making","Music Theory"],Art:["Digital Painting","Sketch Daily"],Business:["Startup 101","Marketing"],Cooking:["Recipes","Baking"],Fitness:["Fitness Plan","Yoga"],Creativity:["UI Design"]};
function go(list){let n=document.getElementById('name').value||'Arosmita Sahoo';localStorage.setItem('n',n);localStorage.setItem('i',list.join(','));show();}
function show(){let n=localStorage.getItem('n')||'Arosmita Sahoo';let i=localStorage.getItem('i')||'Technology';document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('uName').innerText=n.split(' ')[0];document.getElementById('ints').innerText=i;let all=[];i.split(',').forEach(k=>{if(DB[k.trim()]) all=[...all,...DB[k.trim()]]});let html='';all.forEach(t=>{html+=`<div class="bg-[#12121b] border border-white/10 rounded-2xl p-4"><div class="font-bold">${t}</div><div class="text-[11px] opacity-50 mt-1">Recommended for ${n.split(' ')[0]}</div></div>`});document.getElementById('cards').innerHTML=html;}
if(localStorage.getItem('n')) show();
</script></body></html>
